name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (vX.Y.Z). Used when this run is not already on that tag.
        required: false
        type: string

permissions:
  id-token: write
  contents: write

concurrency:
  group: npm-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Require the tag to match package.json
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${RELEASE_TAG}' must look like v1.2.3."
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${version}. Expected v${version}."
            exit 1
          fi
          echo "TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require npm >= 11.5.1
        run: |
          set -euo pipefail
          npm install -g npm@11
          npm --version
          node -e 'const {execSync}=require("node:child_process"); const [major,minor,patch]=execSync("npm --version",{encoding:"utf8"}).trim().split(".").map(Number); const ok=major>11||(major===11&&(minor>5||(minor===5&&patch>=1))); if(!ok){console.error("npm is older than 11.5.1"); process.exit(1);}'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        # Trusted publishing authenticates this step with GitHub OIDC. No NPM_TOKEN is required.
        # Token fallback, if the trusted publisher is not configured yet:
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" --generate-notes --title "${TAG}"
